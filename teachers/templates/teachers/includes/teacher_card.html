<article class="teacher-card mb-3 shadow-sm">
  <div class="d-flex justify-content-between align-items-start">
    <div>
      <h5 class="fw-bold mb-1">
        <a href="{% url 'teachers:detail' item.teacher.id %}" class="text-decoration-none">
          {{ item.teacher.name|default:"Без имени" }}
        </a>
      </h5>
      <div class="text-muted small">
        {{ item.teacher.position }} &bull; {{ item.teacher.department }}
      </div>
    </div>
    <div class="text-end">
      <span class="badge bg-primary">Ставка: {{ item.teacher.rate|floatformat:2 }}</span>
    </div>
  </div>
  <div class="mt-3 d-flex justify-content-between align-items-center">
    <div class="small">
      <strong>Факт / План:</strong> {{ item.total|floatformat:1 }} / {{ item.norm|floatformat:1 }} ч
      <span class="ms-2 badge {{ item.badge_cls }}">{{ item.comp }}</span>
    </div>
    <a href="{% url 'teachers:detail' item.teacher.id %}" class="btn btn-sm btn-outline-primary">
      Карточка &rarr;
    </a>
  </div>
</article>
