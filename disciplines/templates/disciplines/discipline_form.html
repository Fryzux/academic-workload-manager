{% extends "base.html" %}

{% block title %}Добавление дисциплины — Учет нагрузки{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-dark text-white py-3">
        <h4 class="mb-0 fw-bold">Добавление предмета (дисциплины)</h4>
      </div>
      <div class="card-body p-4">
        {% if error %}
          <div class="alert alert-danger" role="alert">
            {{ error }}
          </div>
        {% endif %}

        <form method="post" action="{% url 'disciplines:add' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-bold">Наименование дисциплины *</label>
            <input type="text" name="name" class="form-control"
                   placeholder="Например: Архитектура распределенных систем"
                   value="{{ name }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Закрепляющая кафедра *</label>
            <input type="text" name="department" class="form-control"
                   value="{{ department }}" required>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold">Номер семестра (1 .. 12) *</label>
            <input type="number" min="1" max="12" name="semester"
                   class="form-control" value="{{ semester_str }}" required>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'disciplines:list' %}" class="btn btn-outline-secondary">Отмена</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
